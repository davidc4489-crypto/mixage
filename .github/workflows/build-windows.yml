name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller onnx

      - name: Download the fp16 HT-Demucs model (84 MB) and convert it to fp32
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/monteslu/htdemucs-ft-webgpu/resolve/main/htdemucs_ft_vocals_safe16.onnx" -OutFile models/htdemucs_ft_vocals_safe16.onnx
          python tools/convert_fp32.py models/htdemucs_ft_vocals_safe16.onnx models/htdemucs_ft_vocals_fp32.onnx
          Remove-Item models/htdemucs_ft_vocals_safe16.onnx

      - name: Download the Spleeter models (2 x 39 MB, Release model-v2)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/davidc4489-crypto/mixage/releases/download/model-v2/spleeter_vocals.onnx" -OutFile models/spleeter_vocals.onnx
          Invoke-WebRequest -Uri "https://github.com/davidc4489-crypto/mixage/releases/download/model-v2/spleeter_accompaniment.onnx" -OutFile models/spleeter_accompaniment.onnx
          Get-ChildItem models | Select-Object Name, Length

      - name: Check the WebGPU plugin loads in this Python (no GPU on the runner)
        run: python -m mixage --info

      - name: Build with PyInstaller
        run: pyinstaller mixage.spec --noconfirm

      - name: Check accelerators inside the exe (WebGPU plugin must be present)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/Mixage.exe) -ArgumentList "--info" -Wait -PassThru -NoNewWindow -RedirectStandardOutput info.txt
          Get-Content info.txt
          if (Select-String -Path info.txt -Pattern "plugin onnxruntime-ep-webgpu absent" -Quiet) { Write-Error "plugin WebGPU absent de l'exe"; exit 1 }

      - name: Smoke test (CLI on a generated tone, CPU – both models)
        shell: pwsh
        run: |
          python -c "import numpy as np, soundfile as sf; sr=44100; t=np.arange(sr*3)/sr; x=np.stack([np.sin(2*np.pi*220*t), np.sin(2*np.pi*330*t)],1)*0.3; sf.write('tone.wav', x.astype('float32'), sr)"
          # Application sans console : PowerShell n'attend pas sa fin par défaut.
          $p = Start-Process -FilePath (Resolve-Path dist/Mixage.exe) -ArgumentList "tone.wav","-o","tone_demucs.wav","--device","cpu" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "Mixage.exe (demucs) a terminé avec le code $($p.ExitCode)"; exit 1 }
          $p = Start-Process -FilePath (Resolve-Path dist/Mixage.exe) -ArgumentList "tone.wav","-o","tone_spleeter.wav","--model","spleeter" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "Mixage.exe (spleeter) a terminé avec le code $($p.ExitCode)"; exit 1 }
          Get-ChildItem tone_*.wav | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Mixage-windows
          path: dist/Mixage.exe

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mixage.exe
